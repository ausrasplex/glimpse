# Example for running Glimpse with docker compose (outside Unraid, or to try it out).
# On Unraid, use the template in unraid/glimpse.xml instead, and run PostgreSQL and Redis
# as their own containers from Community Applications.
services:
  glimpse:
    image: ghcr.io/YOUR_GITHUB_USER/glimpse:latest
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      APP_URL: https://glimpse.example.com
      SECRET_KEY: change-me-to-the-output-of-openssl-rand-hex-32
      DATABASE_URL: postgresql://glimpse:glimpse@postgres:5432/glimpse
      REDIS_URL: redis://redis:6379
      STORAGE: local            # clips, photos, music and mashes go in ./media
      # To use S3-compatible storage instead (Garage, SeaweedFS, MinIO):
      # STORAGE: s3
      # S3_ENDPOINT: http://garage:3900
      # S3_BUCKET: glimpse
      # S3_ACCESS_KEY: ...
      # S3_SECRET_KEY: ...
      # S3_REGION: garage
      TZ: Australia/Melbourne
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./data:/data
      - ./media:/media
    depends_on: [postgres, redis]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: glimpse, POSTGRES_PASSWORD: glimpse, POSTGRES_DB: glimpse }
    volumes: ["./postgres:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["./redis:/data"]
